<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lwazi Mpangase — Mpangase Jewellery</title>
<meta name="description" content="Digital business card for Lwazi Mpangase, Jewellery Designer at Mpangase Jewellery." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-0: #050914;
    --navy-1: #0b1226;
    --navy-2: #131d3a;
    --blue: #2f7ff5;
    --blue-soft: rgba(47,127,245,0.16);
    --paper: #f5f7fb;
    --ink: #e9edf6;
    --muted: #8993ab;
    --line: rgba(255,255,255,0.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(120% 100% at 50% 0%, var(--navy-2) 0%, var(--navy-1) 45%, var(--navy-0) 100%);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px 32px;
  }

  .page {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* ---------- Flip card ---------- */
  .stage { width: 100%; }

  .card-wrap {
    width: 100%;
    aspect-ratio: 1050 / 600;
    perspective: 1600px;
    cursor: pointer;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform .65s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 30px 60px -20px rgba(0,0,0,0.65),
      0 0 0 1px rgba(255,255,255,0.06);
  }
  .face.back { transform: rotateY(180deg); }

  .face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
    letter-spacing: .01em;
  }

  /* ---------- Identity block ---------- */
  .identity {
    text-align: center;
    padding-top: 4px;
  }
  .identity h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 4px;
    color: var(--paper);
  }
  .identity p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- Actions ---------- */
  .actions {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .actions a, .actions button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 14px;
    border-radius: 10px;
    background: var(--navy-2);
    border: 1px solid var(--line);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .actions a:hover, .actions button:hover {
    border-color: rgba(47,127,245,0.5);
    background: var(--blue-soft);
  }
  .actions a:active, .actions button:active { transform: scale(0.98); }

  .actions .full { grid-column: 1 / -1; background: var(--blue); border-color: var(--blue); }
  .actions .full:hover { background: #4a90ff; border-color: #4a90ff; }

  .icon { width: 16px; height: 16px; flex-shrink: 0; }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding-top: 10px;
    line-height: 1.8;
    border-top: 1px solid var(--line);
    width: 100%;
    margin-top: 4px;
  }
  footer .dev { color: #a7afc4; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
